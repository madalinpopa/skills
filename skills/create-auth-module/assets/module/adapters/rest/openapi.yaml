openapi: 3.0.3
info:
  title: Auth API
  version: 0.1.0
  description: >
    Registration, login, token refresh, logout, and the caller's own profile.
    Access tokens are short-lived JWTs sent as bearer tokens. Refresh tokens
    are opaque and reach web clients as an HttpOnly cookie; a client that sends
    `X-Client-Type: mobile` gets them in the response body instead.

paths:
  /auth/register:
    post:
      summary: Register a user
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The email address is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Log in
      description: >
        Checks the email and password and starts a session. Wrong credentials
        and unknown accounts get the same 401 so the response cannot be used
        to find registered addresses.
      operationId: login
      tags:
        - Auth
      parameters:
        - $ref: '#/components/parameters/ClientType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session started.
          headers:
            Set-Cookie:
              description: Refresh token cookie. Set for web clients only.
              schema:
                type: string
            Cache-Control:
              description: Always no-store, so the tokens are never cached.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      summary: Refresh the session
      description: >
        Exchanges an active refresh token for a new access token and a new
        refresh token. The presented token is retired. Presenting a token that
        was already exchanged is treated as a replay and ends every session of
        that user.
      operationId: refresh
      tags:
        - Auth
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - $ref: '#/components/parameters/RefreshCookie'
      requestBody:
        required: false
        description: Refresh token for mobile clients. Web clients send the cookie.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session renewed.
          headers:
            Set-Cookie:
              description: New refresh token cookie. Set for web clients only.
              schema:
                type: string
            Cache-Control:
              description: Always no-store, so the tokens are never cached.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Log out
      description: >
        Revokes the presented refresh token. The access token stays valid
        until it expires. Web clients get the cookie cleared.
      operationId: logout
      tags:
        - Auth
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientType'
        - $ref: '#/components/parameters/RefreshCookie'
      requestBody:
        required: false
        description: Refresh token for mobile clients. Web clients send the cookie.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session ended.
          headers:
            Set-Cookie:
              description: Expired refresh token cookie. Set for web clients only.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      summary: Get the caller's profile
      operationId: getMe
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The user behind the token no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientType:
      in: header
      name: X-Client-Type
      required: false
      description: >
        `web` (default) receives the refresh token as an HttpOnly cookie.
        `mobile` receives it in the response body and sends it back in the
        request body.
      schema:
        type: string

    RefreshCookie:
      in: cookie
      name: refresh_token
      x-go-name: RefreshToken
      required: false
      description: Refresh token cookie set at login for web clients.
      schema:
        type: string

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          x-go-type: string
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    RegisterResponse:
      type: object
      required:
        - user_uuid
      properties:
        user_uuid:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          x-go-type: string
        password:
          type: string
          format: password

    SessionResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - user_uuid
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        user_uuid:
          type: string
        refresh_token:
          type: string
          description: Present for mobile clients only.

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    UserResponse:
      type: object
      required:
        - user_uuid
        - name
        - email
        - created_at
        - updated_at
      properties:
        user_uuid:
          type: string
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - slug
        - message
      properties:
        slug:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: The credential is missing, malformed, or rejected.
      headers:
        WWW-Authenticate:
          description: Bearer challenge, sent by bearer-protected operations.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
