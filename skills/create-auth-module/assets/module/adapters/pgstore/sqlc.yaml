version: "2"

sql:
  - engine: postgresql
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "models"
        out: "models"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_pointers_for_null_types: true

        overrides:
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - column: "auth.users.user_uuid"
            go_type:
              import: "{{MODULE_PATH}}/internal/modules/auth/domain"
              type: "UserUUID"

          - column: "auth.refresh_tokens.token_uuid"
            go_type:
              import: "{{MODULE_PATH}}/internal/modules/auth/domain"
              type: "TokenUUID"

          - column: "auth.refresh_tokens.user_uuid"
            go_type:
              import: "{{MODULE_PATH}}/internal/modules/auth/domain"
              type: "UserUUID"
