name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z '*.go' ':!skills' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...

  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate skills and run their tests
        run: |
          for skill in skills/*/; do
            uv run -q --with pyyaml bash skills/create-repo-skill/scripts/validate-skill.sh "$skill"
            if [ -d "${skill}tests" ]; then
              uv run -q --with pyyaml python3 -B -m unittest discover -s "${skill}tests"
            fi
          done
